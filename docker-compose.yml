services:
  api:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/postflow
    depends_on:
      - mongo
    volumes:
      - ./server/src:/app/src
    command: npm run dev

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      # Runs in the browser, not the container network — must be an
      # address the host machine (and the browser on it) can resolve,
      # which the internal Docker service name "api" is not.
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    volumes:
      - ./client/src:/app/src
    command: npm run dev -- --host

volumes:
  mongo_data:
